{% extends "base.html" %}
{% block title %}Login - Smart Barcode Scanner{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-icon">🔒</div>
        <h1 class="login-title">Smart Barcode Scanner</h1>
        <p class="login-subtitle">Please login to continue</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="admin" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="login-buttons">
                <button type="submit" class="btn btn-primary">Login</button>
                <a href="/" class="btn btn-secondary">Exit</a>
            </div>
        </form>

        <p class="login-footer">Default: admin / admin123</p>
    </div>
</div>
{% endblock %}
